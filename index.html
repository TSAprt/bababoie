<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carte des offres — Topographie · Hydrographie · LiDAR · Géomatique</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />

<style>
  :root {
    --ink: #1b1f23;
    --paper: #f7f5f0;
    --accent: #1f5c4a;
    --accent-soft: #e7efe9;
    --border: #d9d5c9;
    font-family: "Söhne", "Inter", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }

  #app { display: flex; height: 100vh; }

  #sidebar {
    width: 320px;
    min-width: 280px;
    background: #fff;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  #sidebar header {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  #sidebar .sub {
    font-size: 12px;
    color: #6b6f76;
    margin: 0;
  }
  #meta {
    padding: 10px 18px;
    font-size: 12px;
    color: #6b6f76;
    border-bottom: 1px solid var(--border);
  }
  #filters {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #filters label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6b6f76;
    font-weight: 600;
  }
  #filters input, #filters select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: var(--paper);
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  .job-card {
    padding: 12px 18px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    transition: background 0.15s;
  }
  .job-card:hover { background: var(--accent-soft); }
  .job-card .title { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
  .job-card .meta { font-size: 12px; color: #6b6f76; }
  .job-card .tag {
    display: inline-block;
    font-size: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 10px;
    margin-top: 4px;
  }

  #map { flex: 1; }

  .popup-title { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
  .popup-meta { font-size: 12px; color: #444; margin-bottom: 6px; }
  .popup-link {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 5px;
    text-decoration: none;
  }

  #empty-state {
    padding: 40px 18px;
    text-align: center;
    color: #6b6f76;
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <header>
      <h1>Offres — Topo · Hydro · LiDAR · Géomatique</h1>
      <p class="sub">Niveau ingénieur (Bac+5) · mis à jour automatiquement</p>
    </header>
    <div id="meta">Chargement…</div>
    <div id="filters">
      <div>
        <label for="search">Recherche</label>
        <input id="search" type="text" placeholder="mot-clé, entreprise, ville…" />
      </div>
      <div>
        <label for="country">Pays</label>
        <select id="country"><option value="">Tous</option></select>
      </div>
      <div>
        <label for="keyword">Domaine</label>
        <select id="keyword"><option value="">Tous</option></select>
      </div>
    </div>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

<script>
const map = L.map('map', { worldCopyJump: true }).setView([30, 10], 2.3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 18
}).addTo(map);

const cluster = L.markerClusterGroup();
map.addLayer(cluster);

let ALL_FEATURES = [];
let markersByJob = new Map();

function fmtDate(iso) {
  if (!iso) return "date inconnue";
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}

function popupHtml(p) {
  const salary = (p.salary_min && p.salary_max)
    ? `${Math.round(p.salary_min).toLocaleString('fr-FR')}–${Math.round(p.salary_max).toLocaleString('fr-FR')}`
    : null;
  return `
    <div class="popup-title">${p.title}</div>
    <div class="popup-meta">
      ${p.company} — ${p.location}<br/>
      Publié le ${fmtDate(p.created)}${salary ? " · " + salary : ""}
    </div>
    <a class="popup-link" href="${p.url}" target="_blank" rel="noopener">Voir l'offre →</a>
  `;
}

function renderList(features) {
  const listEl = document.getElementById('list');
  listEl.innerHTML = "";
  if (features.length === 0) {
    listEl.innerHTML = `<div id="empty-state">Aucune offre ne correspond à ces filtres.</div>`;
    return;
  }
  features.forEach(f => {
    const p = f.properties;
    const card = document.createElement('div');
    card.className = 'job-card';
    card.innerHTML = `
      <div class="title">${p.title}</div>
      <div class="meta">${p.company} — ${p.location}</div>
      <span class="tag">${p.country}</span>
    `;
    card.addEventListener('click', () => {
      map.flyTo([f.geometry.coordinates[1], f.geometry.coordinates[0]], 9);
      const m = markersByJob.get(p.url);
      if (m) setTimeout(() => m.openPopup(), 400);
    });
    listEl.appendChild(card);
  });
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const country = document.getElementById('country').value;
  const keyword = document.getElementById('keyword').value;

  const filtered = ALL_FEATURES.filter(f => {
    const p = f.properties;
    const matchQ = !q || `${p.title} ${p.company} ${p.location}`.toLowerCase().includes(q);
    const matchC = !country || p.country === country;
    const matchK = !keyword || p.matched_keyword === keyword;
    return matchQ && matchC && matchK;
  });

  cluster.clearLayers();
  markersByJob.clear();
  filtered.forEach(f => {
    const p = f.properties;
    const [lon, lat] = f.geometry.coordinates;
    const marker = L.marker([lat, lon]).bindPopup(popupHtml(p));
    markersByJob.set(p.url, marker);
    cluster.addLayer(marker);
  });

  renderList(filtered);
}

fetch('data/jobs.geojson')
  .then(r => r.json())
  .then(data => {
    ALL_FEATURES = data.features || [];
    document.getElementById('meta').textContent =
      `${ALL_FEATURES.length} offres · généré le ${fmtDate(data.generated_at)}`;

    const countries = [...new Set(ALL_FEATURES.map(f => f.properties.country))].sort();
    const keywords = [...new Set(ALL_FEATURES.map(f => f.properties.matched_keyword))].sort();

    const countrySel = document.getElementById('country');
    countries.forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      countrySel.appendChild(o);
    });
    const keywordSel = document.getElementById('keyword');
    keywords.forEach(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = k;
      keywordSel.appendChild(o);
    });

    applyFilters();
  })
  .catch(err => {
    document.getElementById('meta').textContent = "Erreur de chargement des données.";
    document.getElementById('list').innerHTML =
      `<div id="empty-state">Impossible de charger data/jobs.geojson.<br/>Lance le scraper au moins une fois (voir README).</div>`;
    console.error(err);
  });

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('country').addEventListener('change', applyFilters);
document.getElementById('keyword').addEventListener('change', applyFilters);
</script>

</body>
</html>
